# ML Trading Application Configuration - New Architecture
# =====================================================
# Updated: January 2025
# Architecture: Clean, modular, production-ready

# Application Metadata
application:
  name: "ML Trading System"
  version: "2.0.0"
  environment: "development"  # development, staging, production
  
# Trading Configuration
trading:
  # Supported assets
  assets:
    stocks:
      - symbol: "AAPL"
        name: "Apple Inc."
        sector: "technology"
        market_cap: "large"
        volatility_class: "medium"
      - symbol: "TSLA" 
        name: "Tesla Inc."
        sector: "automotive"
        market_cap: "large"
        volatility_class: "high"
      - symbol: "MSFT"
        name: "Microsoft Corp."
        sector: "technology"
        market_cap: "large"
        volatility_class: "low"
      - symbol: "NVDA"
        name: "NVIDIA Corp."
        sector: "technology"
        market_cap: "large"
        volatility_class: "high"
      - symbol: "GOOGL"
        name: "Alphabet Inc."
        sector: "technology"
        market_cap: "large"
        volatility_class: "medium"
  
  # Default configurations
  default_symbol: "AAPL"
  default_timeframe: "1d"  # 1d, 1h, 4h
  
  # Position sizing
  position_sizing:
    method: "fixed_percentage"  # fixed_amount, fixed_percentage, volatility_adjusted
    default_percentage: 0.10    # 10% of portfolio per position
    max_percentage: 0.20        # Maximum 20% per position
    min_position_value: 100     # Minimum $100 position
    
  # Risk management
  risk_management:
    stop_loss_percentage: 0.03      # 3% stop loss
    take_profit_percentage: 0.06    # 6% take profit
    max_positions: 5                # Maximum concurrent positions
    daily_loss_limit: 0.05          # 5% daily loss limit
    
  # Trading costs
  costs:
    commission_per_trade: 0.00      # $0 commission (modern brokers)
    spread_cost_percentage: 0.001   # 0.1% spread cost
    slippage_percentage: 0.001      # 0.1% slippage

# Machine Learning Configuration
machine_learning:
  # Primary algorithm (based on our Apple/Tesla analysis)
  primary_algorithm: "LightGBM"
  
  # Model configurations
  models:
    LightGBM:
      # Optimized configuration from backtesting results
      default:
        n_estimators: 100
        max_depth: 4
        learning_rate: 0.08
        num_leaves: 15
        subsample: 0.8
        colsample_bytree: 0.8
        reg_alpha: 0.1
        reg_lambda: 0.5
        min_child_samples: 20
        random_state: 42
        verbose: -1
        
      # Conservative configuration for stable stocks  
      conservative:
        n_estimators: 50
        max_depth: 3
        learning_rate: 0.03
        num_leaves: 10
        subsample: 0.7
        colsample_bytree: 0.7
        reg_alpha: 0.5
        reg_lambda: 2.0
        min_child_samples: 100
        random_state: 42
        verbose: -1
        
      # Aggressive configuration for volatile stocks
      aggressive:
        n_estimators: 150
        max_depth: 5
        learning_rate: 0.12
        num_leaves: 25
        subsample: 0.9
        colsample_bytree: 0.9
        reg_alpha: 0.05
        reg_lambda: 0.3
        min_child_samples: 10
        random_state: 42
        verbose: -1
  
  # Training configuration
  training:
    # Data requirements
    min_training_samples: 200
    min_positive_samples: 50
    test_size: 0.3
    validation_method: "time_series_split"
    cv_folds: 5
    
    # Feature engineering
    feature_engineering:
      # Technical indicators
      indicators:
        # Moving averages
        sma_periods: [5, 10, 20, 50]
        ema_periods: [12, 26]
        
        # Momentum indicators
        rsi_periods: [14, 21]
        momentum_periods: [3, 5, 10, 20]
        
        # Volatility indicators
        volatility_periods: [5, 10, 20]
        bollinger_period: 20
        bollinger_std: 2
        
        # Volume indicators
        volume_sma_periods: [10, 20]
        
        # MACD
        macd_fast: 12
        macd_slow: 26
        macd_signal: 9
      
      # Advanced features (based on Apple analysis)
      advanced_features:
        price_position: true          # high/low relative positioning
        gap_analysis: true           # opening gaps
        intraday_strength: true      # intraday momentum
        volatility_breakouts: true   # volatility expansion/contraction
        volume_surges: true          # unusual volume activity
        trend_strength: true         # trend acceleration/deceleration
        seasonal_effects: true       # monthly/quarterly patterns
        
    # Target definition (multi-horizon approach from backtesting)
    target_definition:
      method: "multi_horizon"
      horizons:
        - days: 1
          threshold: 0.008  # 0.8% in 1 day
        - days: 3
          threshold: 0.015  # 1.5% in 3 days
        - days: 5
          threshold: 0.025  # 2.5% in 5 days
      combination_method: "any"  # any profitable horizon triggers positive target
  
  # Model retraining (validated from Apple backtesting)
  retraining:
    # Retraining frequency
    frequency_days: 14  # 2-week cycles (proven effective)
    
    # Asset-specific frequencies
    asset_specific:
      high_volatility: 10    # Weekly for volatile assets
      medium_volatility: 14  # Bi-weekly for medium volatility
      low_volatility: 21     # Tri-weekly for stable assets
    
    # Retraining triggers
    triggers:
      accuracy_threshold: 0.45    # Retrain if accuracy drops below 45%
      confidence_threshold: 0.50  # Retrain if avg confidence drops below 50%
      days_since_last: 14         # Maximum days without retraining
      
    # Training window strategy
    window_strategy: "expanding"  # expanding, sliding
    max_training_days: 500        # Maximum days to include in training
  
  # Prediction configuration
  prediction:
    confidence_threshold: 0.52    # Minimum confidence for trading signal
    ensemble_voting: false        # Use multiple models
    prediction_horizon: 5         # Days to predict forward

# Data Management
data:
  # Data sources
  sources:
    primary: "yfinance"
    backup: "alpha_vantage"  # Fallback data source
    
  # Data collection
  collection:
    # Historical data requirements
    min_history_days: 400
    max_history_days: 1000
    
    # Update frequency
    update_frequency: "daily"
    market_hours_only: true
    
    # Data quality
    quality_checks:
      min_volume: 100000      # Minimum daily volume
      max_gap_percentage: 0.20 # Maximum price gap (20%)
      outlier_detection: true
      
  # Data storage
  storage:
    cache_enabled: true
    cache_directory: "data/cache"
    cache_expiry_hours: 6
    
    # Persistence
    database:
      type: "sqlite"  # sqlite, postgresql, mysql
      path: "data/trading_data.db"
      
# Backtesting Configuration (based on our Apple framework)
backtesting:
  # Default backtesting parameters
  default_period_days: 365
  initial_capital: 100000
  
  # Backtesting strategies
  strategies:
    # Static strategy (no retraining)
    static:
      training_ratio: 0.6  # 60% for training
      testing_ratio: 0.4   # 40% for testing
      
    # Adaptive strategy (with retraining)  
    adaptive:
      initial_training_ratio: 0.5  # 50% initial training
      retraining_frequency: 14     # Days between retraining
      expanding_window: true       # Use expanding training window
      
  # Performance metrics
  metrics:
    calculate_returns: true
    calculate_sharpe: true
    calculate_max_drawdown: true
    calculate_win_rate: true
    calculate_trade_frequency: true
    
  # Risk modeling
  risk_modeling:
    var_confidence: 0.05      # 95% VaR
    expected_shortfall: true
    maximum_drawdown_limit: 0.20  # 20% max drawdown

# Portfolio Management
portfolio:
  # Portfolio construction
  construction:
    max_assets: 5
    rebalancing_frequency: "weekly"
    correlation_threshold: 0.7  # Maximum correlation between assets
    
  # Capital allocation
  allocation:
    cash_reserve: 0.10      # Keep 10% in cash
    single_asset_limit: 0.20  # Maximum 20% per asset
    sector_limit: 0.50      # Maximum 50% per sector
  
  # Starting portfolio value for simulations
  starting_value: 100000
  
  # Position sizing
  max_position_size: 1000  # Maximum shares per position

# Risk Management System
risk_management:
  # Position-level risks
  position_risks:
    max_position_size: 0.20     # 20% of portfolio
    stop_loss_percentage: 0.03  # 3% stop loss
    take_profit_percentage: 0.06 # 6% take profit
    max_holding_days: 30        # Maximum holding period
    
  # Portfolio-level risks
  portfolio_risks:
    max_daily_loss: 0.05        # 5% daily loss limit
    max_weekly_loss: 0.10       # 10% weekly loss limit
    max_drawdown: 0.20          # 20% maximum drawdown
    volatility_limit: 0.25      # 25% annual volatility limit
    
  # Market condition checks
  market_conditions:
    market_crash_protection: true
    volatility_spike_protection: true
    low_liquidity_protection: true
    
# Monitoring and Alerting
monitoring:
  # Performance monitoring
  performance:
    daily_pnl_alerts: true
    weekly_performance_reports: true
    monthly_risk_reports: true
    
  # Model monitoring
  model_monitoring:
    accuracy_degradation_alerts: true
    prediction_confidence_alerts: true
    feature_drift_detection: true
    
  # Alert thresholds
  alerts:
    daily_loss_threshold: 0.03      # 3% daily loss
    accuracy_drop_threshold: 0.10   # 10% accuracy drop
    confidence_drop_threshold: 0.15 # 15% confidence drop
    
  # Notification methods
  notifications:
    email_enabled: false
    slack_enabled: false
    console_logging: true

# Analysis and Reporting
analysis:
  # Analysis types
  analysis_types:
    performance_analysis: true
    risk_analysis: true
    attribution_analysis: true
    backtesting_analysis: true
    
  # Visualization
  visualization:
    generate_plots: true
    plot_directory: "reports/plots"
    plot_formats: ["png", "html"]
    
  # Reports
  reporting:
    generate_reports: true
    report_directory: "reports"
    report_formats: ["html", "pdf"]
    auto_email_reports: false

# Environment Configuration
environment:
  # Paths
  paths:
    models_directory: "models"
    data_directory: "data"
    logs_directory: "logs" 
    reports_directory: "reports"
    cache_directory: "cache"
    
  # Logging
  logging:
    level: "INFO"  # DEBUG, INFO, WARNING, ERROR
    file_logging: true
    console_logging: true
    log_rotation: true
    max_log_size_mb: 100
    
  # Performance
  performance:
    parallel_processing: true
    max_workers: 4
    memory_limit_gb: 8
    
  # Development settings
  development:
    debug_mode: false
    profiling_enabled: false
    test_mode: false
    paper_trading: true

# External Services (for future integration)
external_services:
  # Brokerage APIs
  brokers:
    robinhood:
      enabled: false
      paper_trading: true
      
    interactive_brokers:
      enabled: false
      paper_trading: true
      
  # Data services
  data_services:
    alpha_vantage:
      enabled: false
      api_key: null
      
    quandl:
      enabled: false
      api_key: null
      
  # News and sentiment
  news_services:
    news_api:
      enabled: false
      api_key: null
      
# Security
security:
  # API keys and secrets (use environment variables in production)
  api_keys:
    storage_method: "environment"  # environment, file, vault
    
  # Data encryption
  encryption:
    encrypt_stored_data: false
    encrypt_model_files: false
    
  # Access control
  access_control:
    require_authentication: false
    session_timeout_minutes: 60